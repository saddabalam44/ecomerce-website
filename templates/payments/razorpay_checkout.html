{% extends 'base.html' %}
{% block title %}ShopSphere - Razorpay Checkout{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 text-center mt-5">
        <div class="card border-0 shadow-lg p-5 rounded-4 bg-white border-top border-4 border-primary">
            <div class="fs-1 text-primary mb-3">
                <i class="bi bi-credit-card" style="font-size: 5rem;"></i>
            </div>
            <h2 class="fw-bold mb-2">Razorpay Payment Gateway</h2>
            <p class="text-secondary mb-4">Complete payment for Order <strong>#{{ order.id }}</strong> amounting to <strong>₹{{ order.final_amount }}</strong>.</p>
            
            <div class="d-flex flex-column gap-3">
                <button id="rzp-button1" class="btn btn-primary btn-lg rounded-pill py-3 fw-bold shadow-sm">
                    <i class="bi bi-credit-card me-2"></i> Pay Now (₹{{ order.final_amount }})
                </button>
                <a href="{% url 'payments:payment_selection' order.id %}" class="btn btn-outline-secondary rounded-pill py-2">
                    Back to Payment Options
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
var options = {
    "key": "{{ razorpay_key_id }}",
    "amount": "{{ amount_paise }}",
    "currency": "INR",
    "name": "ShopSphere",
    "description": "Payment for Order #{{ order.id }}",
    "order_id": "{{ razorpay_order_id }}",
    "handler": function (response){
        // Post payment details to callback url
        var form = document.createElement('form');
        form.method = 'POST';
        form.action = '{{ callback_url }}';
        
        var inputs = {
            'razorpay_payment_id': response.razorpay_payment_id,
            'razorpay_order_id': response.razorpay_order_id,
            'razorpay_signature': response.razorpay_signature,
            'order_id': '{{ order.id }}',
            'csrfmiddlewaretoken': '{{ csrf_token }}'
        };
        
        for (var key in inputs) {
            var input = document.createElement('input');
            input.type = 'hidden';
            input.name = key;
            input.value = inputs[key];
            form.appendChild(input);
        }
        
        document.body.appendChild(form);
        form.submit();
    },
    "prefill": {
        "name": "{{ order.shipping_address.full_name|default:order.user.username }}",
        "email": "{{ order.user.email }}",
        "contact": "{{ order.shipping_address.phone_number|default:order.user.phone_number|default:'' }}"
    },
    "theme": {
        "color": "#0d6efd"
    }
};
var rzp1 = new Razorpay(options);
rzp1.on('payment.failed', function (response){
    alert("Payment failed: " + response.error.description);
});
document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>
{% endblock %}
