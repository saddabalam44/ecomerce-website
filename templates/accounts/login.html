{% extends 'base.html' %}
{% block title %}ShopSphere - Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card border-0 shadow-lg p-4 rounded-4 bg-white mt-4">
            <div class="text-center mb-4">
                <h2 class="fw-bold">Welcome Back</h2>
                <p class="text-secondary small">Please enter your details to sign in</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email address</label>
                    {{ form.email }}
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    {{ form.password }}
                </div>
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <a href="{% url 'accounts:password_reset' %}" class="small text-decoration-none">Forgot password?</a>
                </div>
                <button type="submit" class="btn btn-gradient w-100 rounded-pill py-2.5">Sign In</button>
            </form>
            
            <div class="text-center mt-4">
                <p class="small text-secondary mb-0">Don't have an account? <a href="{% url 'accounts:register' %}" class="text-decoration-none fw-semibold">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
